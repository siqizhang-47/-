name: miri-ies
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # PyTorch GPU environment
  - pytorch=1.11.0
  - torchvision=0.12.0
  - cudatoolkit=11.3

  # Core scientific stack
  - numpy=1.21.6
  - pandas=2.0.3
  - scikit-learn=1.3.2
  - scipy
  - openpyxl
  - tqdm
  - matplotlib=3.7.0
  - seaborn
  - pyyaml
  - joblib

  # Baseline dependencies
  - lightgbm
  - xgboost

  - pip:
      - hyperimpute==0.1.1
      - ml_collections==0.1.1
      - ninja==1.11.1
