# ZG-NsDiff (spec 21.2) — identical backbone to nsdiff_low_carbon.yaml;
# the only differences are the occurrence head / mask / Bernoulli gating.
inherit: low_carbon_common.yaml
variant: zg
model_name: zg_nsdiff

model:
  d_model: 512
  n_heads: 8
  e_layers: 2
  d_layers: 1
  d_ff: 1024
  factor: 3
  dropout: 0.05
  activation: gelu
  condition_dim: 11
  enc_in: 4
  p_hidden_dims: [64, 64]
  p_hidden_layers: 2
  g_hidden_size: 512
  history_embed_dim: 32
  denoise_context_dim: 64
  denoise_hidden_dim: 128

  gate_hidden_dim: 128
  gate_dropout: 0.10

diffusion:
  steps: 20
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.01
  rolling_length: 24

loss:
  lambda_mean: 1.0
  lambda_variance: 1.0
  lambda_diffusion: 1.0
  lambda_reverse_var: 1.0
  lambda_gate: 0.5

training:
  optimizer: Adam
  learning_rate: 0.0001
  batch_size: 32
  gradient_clip_norm: 1.0
  amp: true
  num_workers: 4
  pretrain_f_epochs: 20
  pretrain_g_epochs: 15
  joint_epochs: 50
  patience: 10

zg:
  use_gate: true
  use_mask: true

sampling:
  chunk_size: 20
  bernoulli_gate: true
