# 快速 sanity check:1 epoch、少量 batch、num_samples=5。
# 目的:验证前向/采样不报形状错(dec_mark 维=label_len+O、mark 维=8、样本 (B,S,O,4))。
seed: 2026
output_dir: outputs_ies_smoke
data:
  path: data/processed_data.xlsx
  input_len: 168
  pred_len: 48
  rolling_length: 96
  train_ratio: 0.7
  val_ratio: 0.1
  stride: 24              # 稀疏采样,加快 smoke
  test_stride: 96
  num_workers: 2
model:
  d_model: 128
  n_heads: 4
  e_layers: 1
  d_layers: 1
  d_ff: 256
  dropout: 0.05
  diffusion_steps: 10
  beta_start: 1.0e-4
  beta_end: 0.02
  beta_schedule: linear
  weather_mlp: true
  g_hidden: 128
  CART_input_x_embed_dim: 32
train:
  epochs: 1
  patience: 8
  batch_size: 16
  lr: 5.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
  max_batches: 5          # 每个 epoch 只跑 5 个 batch
infer:
  num_samples: 5
  val_samples: 5
  qice_bins: 10
  val_max_batches: 2
  test_max_batches: 3
hurdle:
  enable: true
  thresh: 0.5
  nonneg: true
  night: [6, 19]
